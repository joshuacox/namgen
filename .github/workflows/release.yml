name: Release namgen

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact_name: namgen-linux-x86_64.tar.gz
          - os: macos-latest
            target: darwin-arm64
            artifact_name: namgen-darwin-arm64.tar.gz

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Build binary and completions
        run: |
          make all
          make completions

      - name: Package Release Archive
        run: |
          mkdir -p package/bin package/lib package/share/namgen package/share/man/man1 package/completions
          cp namgen package/bin/
          cp libnamgen.* package/lib/ 2>/dev/null || true
          cp -r assets package/share/namgen/
          cp man/namgen.1 package/share/man/man1/
          cp completions/* package/completions/
          cp README.md LICENSE package/ 2>/dev/null || true
          tar -czvf ${{ matrix.artifact_name }} -C package .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Assets for Release
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
